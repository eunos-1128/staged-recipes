schema_version: 1

context:
  version: "1.63.1"
  python_min: "3.12"

package:
  name: openhands-sdk
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/o/openhands-sdk/openhands_sdk-${{ version }}.tar.gz
    sha256: 54cc3080d1680623493bf2ea1bd14af7a3a3adbc82dc30fa6d2e5e2b7be68da6
    patches:
      - optional-laminar.patch
  # The sdist omits LICENSE; this is the file from the v1.63.1 commit.
  - url: https://raw.githubusercontent.com/OpenHands/software-agent-sdk/722e5d403cf75d4e032b79296cfaf178f8678a93/LICENSE
    sha256: 14a9b631c658eee682c6c2973525fbdf808c3457176bc47513052c559cc5ce86
    file_name: LICENSE

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=84.2.1
    - wheel
  run:
    - python >=${{ python_min }}
    - agent-client-protocol >=1.0.0,<1.1.0
    - certifi >=2026.10.19
    - deprecation >=2.1.0
    - fakeredis >=2.40.0
    # fakeredis[lua]
    - lupa >=2.1
    - fastmcp >=4.1.8,<5
    - filelock >=3.20.1
    - httpx >=0.28.1
    # httpx[socks]
    - socksio >=1,<2
    - jsonschema >=4.26.0
    - joserfc >=1.8.0
    - litellm >=1.108.3,<1.109
    - pillow >=13.0.0
    - pydantic >=2.14.3
    - python-frontmatter >=1.3.0
    - python-json-logger >=4.2.0
    - tenacity >=9.1.2
    - websockets >=12
    - tree_sitter >=0.26.1
    - tree-sitter-bash >=0.25

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - openhands.sdk
        - openhands.sdk.conversation
        - openhands.sdk.llm
      pip_check: true
  - script: python test_no_lmnr.py
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      recipe:
        - test_no_lmnr.py

about:
  homepage: https://github.com/OpenHands/software-agent-sdk
  summary: Core functionality for building OpenHands AI agents
  description: |
    A composable Python SDK for building agents, tools, and conversations.
    This package provides the OpenHands execution core without the Canvas UI.
    Laminar tracing is an optional dependency and is not included in this build.
  license: MIT
  license_file: LICENSE
  documentation: https://docs.openhands.dev/sdk
  repository: https://github.com/OpenHands/software-agent-sdk

extra:
  recipe-maintainers:
    - eunos-1128
